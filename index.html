<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trust Video Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        
        <div class="bg-slate-950 px-8 py-6 border-b border-slate-700">
            <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Zero-Trust Video Analyzer
            </h1>
            <p class="text-slate-400 mt-2 text-sm">Strictly authenticated parallel AI processing. Files stream securely to a localized buffer, are analyzed across 160 isolated nodes, and instantly purged upon completion.</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">System Authentication</label>
                    <input type="password" id="apiSecret" placeholder="Enter API Secret" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Video Source (MP4)</label>
                    <input type="file" id="videoFile" accept="video/mp4" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 transition-colors cursor-pointer">
                </div>
            </div>

            <button id="uploadBtn" onclick="processVideo()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-lg shadow-lg shadow-emerald-500/30 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                Deploy AI Matrix
            </button>

            <div id="progress-container" class="hidden mt-8">
                <div class="flex justify-between text-sm mb-2 font-medium">
                    <span id="status-text" class="text-emerald-400">Initializing secure link...</span>
                    <span id="percentage-text" class="text-slate-300">0%</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-3 border border-slate-700 overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <div id="results-container" class="hidden mt-6">
                <label class="block text-sm font-bold text-emerald-400 mb-2 uppercase tracking-wider">Detection Logs</label>
                <div id="results" class="bg-slate-950 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-300 max-h-60 overflow-y-auto whitespace-pre-wrap shadow-inner leading-relaxed"></div>
            </div>
        </div>
    </div>

<script>
    const WORKER_URL = "https://video-brain.rftl.workers.dev"; // Your Worker URL

    async function processVideo() {
        const fileInput = document.getElementById('videoFile');
        const secret = document.getElementById('apiSecret').value;
        const uploadBtn = document.getElementById('uploadBtn');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const percentageText = document.getElementById('percentage-text');
        
        if(!secret) return alert("System Password required.");
        if(!fileInput.files[0]) return alert("Select a video file.");
        
        const file = fileInput.files[0];
        const authHeader = { "Authorization": `Bearer ${secret}` };
        
        uploadBtn.disabled = true;
        document.getElementById('progress-container').classList.remove('hidden');
        document.getElementById('results-container').classList.add('hidden');
        
        // Reset colors in case of a previous failure
        progressBar.classList.remove('bg-red-500');
        progressBar.classList.add('bg-emerald-500');
        statusText.classList.remove('text-red-400');
        statusText.classList.add('text-emerald-400');
        
        try {
            statusText.innerText = "Authenticating and acquiring S3 presigned URL...";
            const linkRes = await fetch(`${WORKER_URL}/get-upload-link`, { headers: authHeader });
            if (!linkRes.ok) throw new Error("Authentication rejected by gateway.");
            const { uploadUrl, fileName } = await linkRes.json();

            statusText.innerText = "Streaming file direct to Backblaze buffer...";
            const uploadRes = await fetch(uploadUrl, { 
                method: 'PUT', 
                body: file, 
                headers: { 'Content-Type': 'video/mp4' } 
            });

            // STRICT FAILSAFE: Halts the pipeline if Backblaze rejects the upload
            if (!uploadRes.ok) {
                const errText = await uploadRes.text();
                throw new Error(`Cloud Storage Rejected Upload (${uploadRes.status}):\n${errText}`);
            }

            statusText.innerText = "Spawning 160 GitHub runner instances...";
            const startRes = await fetch(`${WORKER_URL}/start`, {
                method: 'POST',
                headers: { ...authHeader, "Content-Type": "application/json" },
                body: JSON.stringify({ fileName })
            });
            const { jobId } = await startRes.json();

            const interval = setInterval(async () => {
                const statRes = await fetch(`${WORKER_URL}/status/${jobId}`, { headers: authHeader });
                const state = await statRes.json();
                
                const percentage = Math.round((state.completed / 160) * 100);
                progressBar.style.width = percentage + "%";
                percentageText.innerText = percentage + "%";
                statusText.innerText = `Compiled logs from ${state.completed}/160 nodes...`;

                if (state.status === "completed") {
                    clearInterval(interval);
                    statusText.innerText = "Analysis Final. Buffer successfully purged.";
                    
                    document.getElementById('results-container').classList.remove('hidden');
                    if (state.timestamps.length === 0) {
                        document.getElementById('results').innerHTML = "No human presence detected.";
                    } else {
                        state.timestamps.sort((a,b) => a-b);
                        
                        const formatTime = (s) => {
                            const hrs = Math.floor(s / 3600);
                            const mins = Math.floor((s % 3600) / 60);
                            const secs = s % 60;
                            return hrs > 0 
                                ? `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`
                                : `${mins}:${secs.toString().padStart(2, '0')}`;
                        };

                        // Group consecutive seconds into clean ranges
                        let ranges = [];
                        let start = state.timestamps[0];
                        let prev = start;

                        for (let i = 1; i <= state.timestamps.length; i++) {
                            if (i < state.timestamps.length && state.timestamps[i] <= prev + 3) {
                                prev = state.timestamps[i];
                            } else {
                                if (start === prev) {
                                    ranges.push(`> Subject Detected @ [${formatTime(start)}]`);
                                } else {
                                    ranges.push(`> Subject Detected @ [${formatTime(start)} -> ${formatTime(prev)}]`);
                                }
                                if (i < state.timestamps.length) {
                                    start = state.timestamps[i];
                                    prev = start;
                                }
                            }
                        }
                        document.getElementById('results').innerHTML = ranges.join("\n");
                    }
                    uploadBtn.disabled = false;
                }
            }, 3000);
        } catch (e) {
            console.error(e);
            alert(e.message);
            uploadBtn.disabled = false;
            statusText.innerText = "Pipeline Interrupted.";
            statusText.classList.replace('text-emerald-400', 'text-red-400');
            progressBar.classList.replace('bg-emerald-500', 'bg-red-500');
        }
    }
</script>
</body>
</html>
