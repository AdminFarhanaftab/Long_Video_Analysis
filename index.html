<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Turbo Analyzer</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9fafb; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #progress-bar { width: 0%; height: 8px; background: #10b981; border-radius: 4px; transition: width 0.3s; margin-top: 10px;}
        #results { margin-top: 20px; padding: 10px; background: #1f2937; color: #10b981; border-radius: 4px; display: none; font-family: monospace; max-height: 300px; overflow-y: auto;}
    </style>
</head>
<body>
<div class="card">
    <h2>Secure Video Upload</h2>
    <input type="password" id="apiSecret" placeholder="Enter System Password">
    <input type="file" id="videoFile" accept="video/mp4">
    <button id="uploadBtn" onclick="processVideo()">Upload & Analyze</button>
    
    <div style="background: #e5e7eb; border-radius: 4px; margin-top: 20px;">
        <div id="progress-bar"></div>
    </div>
    <p id="status-text" style="text-align: center; color: #6b7280; font-size: 14px;">Awaiting credentials and file...</p>
    <div id="results"></div>
</div>

<script>
    const WORKER_URL = "https://video-brain.rftl.workers.dev"; // Replace with your URL

    async function processVideo() {
        const fileInput = document.getElementById('videoFile');
        const secret = document.getElementById('apiSecret').value;
        
        if(!secret) return alert("Password required");
        if(!fileInput.files[0]) return alert("Select an MP4 file");
        
        const file = fileInput.files[0];
        const authHeader = { "Authorization": `Bearer ${secret}` };
        
        document.getElementById('uploadBtn').disabled = true;
        document.getElementById('status-text').innerText = "Authenticating and acquiring secure cloud token...";

        try {
            // 1. Get Presigned URL
            const linkRes = await fetch(`${WORKER_URL}/get-upload-link`, { headers: authHeader });
            if (!linkRes.ok) throw new Error("Authentication failed");
            const { uploadUrl, fileName } = await linkRes.json();

            // 2. Upload Video
            document.getElementById('status-text').innerText = "Uploading to secure cloud buffer...";
            await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: { 'Content-Type': file.type }
            });

            // 3. Start Processing
            document.getElementById('status-text').innerText = "Deploying 160 parallel AI agents...";
            const startRes = await fetch(`${WORKER_URL}/start`, {
                method: 'POST',
                headers: { ...authHeader, "Content-Type": "application/json" },
                body: JSON.stringify({ fileName })
            });
            const { jobId } = await startRes.json();

            // 4. Poll
            const interval = setInterval(async () => {
                const statRes = await fetch(`${WORKER_URL}/status/${jobId}`, { headers: authHeader });
                const state = await statRes.json();
                
                const percentage = (state.completed / 160) * 100;
                document.getElementById('progress-bar').style.width = percentage + "%";
                document.getElementById('status-text').innerText = `Analyzed ${state.completed}/160 segments...`;

                if (state.status === "completed") {
                    clearInterval(interval);
                    document.getElementById('status-text').innerText = "Analysis Complete! Video securely purged from cloud.";
                    document.getElementById('results').style.display = "block";
                    
                    state.timestamps.sort((a,b) => a-b);
                    const formattedTimes = state.timestamps.map(s => `[${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}] Human Detected`);
                    document.getElementById('results').innerHTML = formattedTimes.join("<br>");
                    document.getElementById('uploadBtn').disabled = false;
                }
            }, 3000);
        } catch (e) {
            alert(e.message);
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('status-text').innerText = "Error occurred.";
        }
    }
</script>
</body>
</html>
